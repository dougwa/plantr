services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantr}
      POSTGRES_DB: ${POSTGRES_DB:-plantr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantr} -d ${POSTGRES_DB:-plantr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-plantr}:${POSTGRES_PASSWORD:-plantr}@postgres:5432/${POSTGRES_DB:-plantr}?schema=public
      STORAGE_DIR: /app/storage
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
    volumes:
      - api-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  api-storage:
  caddy-data:
  caddy-config:
